params:
  description: "Associate Professor of Information Systems at Tilburg University. Research on digital markets, platform economics, algorithmic governance, online labor markets, and AI-generated content."
  author: "Ulrich Laitenberger"
  subtitle: "Associate Professor of Information Systems · Tilburg University"
  photo: "picture.png"

  bio: |
    I am an Associate Professor at Tilburg University, where I serve as Academic Lead of the
    Information Systems section. My research investigates how digital platforms govern their
    ecosystems — shaping pricing, competition, and the allocation of work and attention. I study
    the consequences of platform design choices such as algorithmic pricing policies,
    recommendation systems, and marketplace governance mechanisms for sellers, workers, and
    consumers. Methodologically, I draw on applied econometrics and causal inference, combining
    large-scale observational data with natural experiments and policy shocks. My work speaks to
    competition policy, labor market regulation, and platform governance.

  interests:
    - Platform Economics
    - Algorithmic Governance
    - Online Labor Markets
    - AI & Digital Markets
    - Competition Policy

